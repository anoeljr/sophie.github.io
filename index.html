function makeLevel(w, seed) {
  const g = [];
  for (let y = 0; y < ROWS; y++) g.push(new Array(w).fill(' '));
  return { w, g, ents: [], cps: [], goal: null, start: { x: 2 * T + 3, y: 10 * T - PH }, seed };
}
function builder(lv) {
  const set = (x, y, c) => { if (x >= 0 && x < lv.w && y >= 0 && y < ROWS) lv.g[y][x] = c; };
  return {
    G(a, b, top = 10) { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, '#'); },
    R(x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') set(x + i, y, s[i]); },
    N(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y, 'o'); },
    A(x, h) { for (let y = 10 - h; y < 10; y++) { set(x, y, 'A'); set(x + 1, y, 'A'); } },
    ST(x, n, dir = 1) { for (let i = 0; i < n; i++) { const h = dir > 0 ? i + 1 : n - i; for (let y = 10 - h; y < 10; y++) set(x + i, y, 'S'); } },
    COL(x, h) { for (let y = 10 - h; y < 10; y++) set(x, y, 'S'); },
    E(x, top = 10) { lv.ents.push({ type: 'tv', x: x * T + 1, y: top * T - 16, w: 14, h: 16, vx: -0.5, vy: 0, alive: true, active: false, anim: x % 8, pause: 0, next: 160 + (x * 53) % 160 }); },
    D(x, row) { lv.ents.push({ type: 'bat', x: x * T - 1, y: row * T, bx: x * T - 1, by: row * T, w: 18, h: 12, alive: true, active: false, t: (x * 37) % 100, vy: 0, dir: 1 }); },
    CP(x) { lv.cps.push({ x: x * T, on: false }); },
    GOAL(x) { lv.goal = { x: x * T, y: 10 * T - 60, w: 16, h: 60 }; },
    P(x) { lv.start = { x: x * T + 3, y: 10 * T - PH }; },
    BOSS(a) { lv.boss = { a, w: 34, h: 52, minX: (a + 6) * T, maxX: (lv.w - 6) * T - 34 }; resetBoss(lv); }
  };
}

function genBG(lv) {
  const r = rng(lv.seed);
  const far = [], near = [], stars = [];
  let x = -30;
  const farLen = lv.w * T * 0.2 + 520;
  while (x < farLen) { const w = 22 + (r() * 40 | 0), h = 46 + (r() * 70 | 0); far.push({ x, w, h }); x += w + (r() * 10 | 0); }
  x = -30;
  const nearLen = lv.w * T * 0.45 + 520;
  while (x < nearLen) { const w = 20 + (r() * 36 | 0), h = 28 + (r() * 58 | 0); near.push({ x, w, h, s: r() * 1000 | 0 }); x += w + 6 + (r() * 22 | 0); }
  for (let i = 0; i < 70; i++) stars.push({ x: r() * 420, y: r() * 130, s: r() < 0.2 ? 2 : 1, p: r() * 6 });
  lv.bg = { far, near, stars };
}

/* ---------- estado do jogo ---------- */
let state = 'title', frame = 0, stateT = 0;

function setState(s) { state = s; stateT = 0; setMusic(s === 'title' || s === 'story' || s === 'final' ? 'intro' : s === 'gameover' ? 'none' : 'lvl'); if (s === 'story') fetchTrack(0); }
let titlePressed = false;

function loadLevel(i) {

  lv = LEVELS[i]();

  player = { x: lv.start.x, y: lv.start.y, w: PW, h: PH, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jbuf: 0, inv: 0, knock: 0, dying: 0, anim: 0, bund: false, bundT: 0, land: 0, rec: 0, airT: 0 };

/* ---------- colisão ---------- */
const SOLID = { '#': 1, 'B': 1, '?': 1, 'U': 1, 'A': 1, 'S': 1 };
function tileAt(tx, ty) { if (ty < 0 || ty >= ROWS) return ' '; if (tx < 0 || tx >= lv.w) return '#'; return lv.g[ty][tx]; }
function solidAt(px, py) { const ty = Math.floor(py / T); if (ty < 0 || ty >= ROWS) return false; return !!SOLID[tileAt(Math.floor(px / T), ty)]; }

function moveX(e) {
  e.x += e.vx; e.hitWall = false;
  if (e.vx > 0) {
    const r = e.x + e.w;
    if (solidAt(r - 0.01, e.y + 1) || solidAt(r - 0.01, e.y + e.h / 2) || solidAt(r - 0.01, e.y + e.h - 1)) { e.x = Math.floor((r - 0.01) / T) * T - e.w; e.vx = 0; e.hitWall = true; }
  } else if (e.vx < 0) {
    if (solidAt(e.x, e.y + 1) || solidAt(e.x, e.y + e.h / 2) || solidAt(e.x, e.y + e.h - 1)) { e.x = (Math.floor(e.x / T) + 1) * T; e.vx = 0; e.hitWall = true; }
  }
}
function moveY(e, isPlayer) {
  e.y += e.vy; e.onGround = false;
  if (e.vy > 0) {
    const bt = e.y + e.h;
    if (solidAt(e.x + 1, bt - 0.01) || solidAt(e.x + e.w - 1, bt - 0.01)) { e.y = Math.floor((bt - 0.01) / T) * T - e.h; e.vy = 0; e.onGround = true; }
  } else if (e.vy < 0) {
    const l = solidAt(e.x + 1, e.y), r = solidAt(e.x + e.w - 1, e.y);
    if (l || r) {
      const ty = Math.floor(e.y / T);
      e.y = (ty + 1) * T; e.vy = 0.5;
      if (isPlayer) {
        const cx = Math.floor((e.x + e.w / 2) / T);
        let tx = cx;
        if (!SOLID[tileAt(cx, ty)]) tx = l ? Math.floor((e.x + 1) / T) : Math.floor((e.x + e.w - 1) / T);
        headHit(tx, ty);
      }
    }
  }
}
function activateBlock(tx, ty, fromAbove) {
  lv.g[ty][tx] = 'U'; bumps[tx + ',' + ty] = 10;
  notesLv++; stats.boxes++; sfx('coin');
  particles.push({ kind: 'popnote', x: tx * T + 4, y: ty * T - 8, vy: fromAbove ? -3.6 : -2.6, life: 26 });
  sparkle(tx * T + 8, ty * T - 4, 6);
  bumpEnemies(tx, ty);
}
function headHit(tx, ty) {
  const c = tileAt(tx, ty);
  if (c === '?') activateBlock(tx, ty, false);
  else if (c === 'B') { bumps[tx + ',' + ty] = 10; sfx('bump'); bumpEnemies(tx, ty); }
  else sfx('bump');
}
function bumpEnemies(tx, ty) {
  for (const e of lv.ents) {
    if (!e.alive || e.type !== 'tv') continue;
    if (Math.abs(e.y + e.h - ty * T) < 3 && e.x + e.w > tx * T && e.x < tx * T + T) killEnemy(e, true);
  }
}

/* ---------- partículas ---------- */
const CONF = ['#ff4fa3', '#ffd23f', '#38b6ff', '#9b5cff', '#ffffff', '#22e4ff'];
function sparkle(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 1.6; particles.push({ kind: 'sp', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 20 + Math.random() * 14, c: col || CONF[i % CONF.length] }); }
}
function confetti(n, x0, w) {
  for (let i = 0; i < n; i++) particles.push({ kind: 'cf', x: x0 + Math.random() * w, y: -10 - Math.random() * 60, vx: (Math.random() - 0.5) * 1.2, vy: 0.6 + Math.random() * 1.2, life: 200 + Math.random() * 100, c: CONF[(Math.random() * CONF.length) | 0], s: Math.random() < 0.5 ? 2 : 3, ph: Math.random() * 6 });
}
function updateParticles() {
  for (const p of particles) {
    p.life--;
    if (p.kind === 'sp') { p.x += p.vx; p.y += p.vy; p.vy += 0.08; }
    else if (p.kind === 'popnote') { p.y += p.vy; p.vy += 0.15; }
    else if (p.kind === 'cf') { p.ph += 0.1; p.x += p.vx + Math.sin(p.ph) * 0.4; p.y += p.vy; }
    else if (p.kind === 'poof') { p.r += 0.6; }
    else if (p.kind === 'txt') { p.y -= 0.4; }
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 40);
}
function drawParticles(ox) {
  for (const p of particles) {
    const x = p.x - ox;
    if (p.kind === 'sp') rect(x, p.y, 2, 2, p.c);
    else if (p.kind === 'popnote') { ctx.globalAlpha = clamp(p.life / 12, 0, 1); ctx.drawImage(NOTE, Math.round(x), Math.round(p.y)); ctx.globalAlpha = 1; }
    else if (p.kind === 'cf') rect(x, p.y, p.s, Math.max(1, Math.round(p.s * Math.abs(Math.cos(p.ph)))), p.c);
    else if (p.kind === 'poof') { ctx.globalAlpha = clamp(p.life / 14, 0, 1); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; rect(x + Math.cos(a) * p.r - 1, p.y + Math.sin(a) * p.r - 1, 3, 3, '#ffffff'); } ctx.globalAlpha = 1; }
    else if (p.kind === 'txt') { ctx.globalAlpha = clamp(p.life / 20, 0, 1); text(p.t, x, p.y, { color: p.c || '#fff' }); ctx.globalAlpha = 1; }
  }
}

/* ---------- inimigos ---------- */
function killEnemy(e, fromBelow) {
  e.alive = false; e.deadT = 70; e.deadMax = 70; if (!e.minion) stats.kills++; sfx('stomp');
  particles.push({ kind: 'poof', x: e.x + e.w / 2, y: e.y + e.h / 2, r: 2, life: 14 });
  if (e.type === 'bat' || fromBelow) { e.falling = true; e.vy = e.type === 'bat' ? -1.5 : -3; }
}
function updateEnemies() {
  for (const e of lv.ents) {
    if (!e.active) { if (e.x < cam.x + W + 24) e.active = true; else continue; }
    if (!e.alive) {
      if (e.falling && e.deadMax - e.deadT > (e.type === 'bat' ? 14 : 0)) { e.vy = Math.min(e.vy + 0.3, 6); e.y += e.vy; }
      e.deadT--; continue;
    }
    if (e.type === 'tv') {
      e.vy = Math.min(e.vy + 0.33, 6);
      if (e.pause > 0) { e.pause--; }
      else {
        if (--e.next <= 0) { e.pause = 50; e.next = 180 + ((e.x * 7) | 0) % 160; }
        const prevVx = e.vx;
        moveX(e);
        if (e.hitWall) e.vx = -prevVx;
        e.anim += 0.2;
      }
      moveY(e, false);
      if (e.onGround && e.pause <= 0) {
        const fx = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
        if (!solidAt(fx, e.y + e.h + 2)) e.vx = -e.vx;
      }
      if (e.y > H + 30) e.alive = false;
    } else if (e.type === 'bat') {
      e.t++;
      e.x = e.bx + Math.sin(e.t * 0.02) * 30;
      e.y = e.by + Math.sin(e.t * 0.06) * 12;
      const c = Math.cos(e.t * 0.02);
      e.dir = c >= 0 ? 1 : -1; e.hover = Math.abs(c) < 0.22;
    }
    if (e.x < cam.x - 120) continue;
    const p = player;
    if (p.dying) continue;
    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.bund && p.vy > 0 && p.y + p.h / 2 < e.y + e.h / 2) {
        killEnemy(e, false);
        particles.push({ kind: 'txt', t: 'BUNDADA!', x: e.x + e.w / 2, y: e.y - 12, life: 36, c: '#ff9ccc' });
      } else if (p.vy > 0 && p.prevBottom <= e.y + 7) {
        killEnemy(e, false);
        p.vy = keys.jump ? -6.4 : -4.4;
        p.y = e.y - p.h;
        particles.push({ kind: 'txt', t: 'POW!', x: e.x + e.w / 2, y: e.y - 12, life: 30, c: '#ffd23f' });
      } else if (p.inv <= 0) {
        hurt(Math.sign(p.x + p.w / 2 - (e.x + e.w / 2)) || 1);
      }
    }
  }
}

/* ---------- chefe: TV GIGANTE ---------- */
const BOSS_INTRO = 260;
function resetBoss(l) {
  const b = l.boss;
  if (!b || b.st === 'dead') return;
  if (b.walled) for (let y = 0; y < 10; y++) l.g[y][b.a - 1] = ' ';
  l.ents = l.ents.filter(e => !e.minion);
  Object.assign(b, { x: b.maxX, y: 10 * T - b.h, hp: 3, st: 'sleep', t: 0, dir: -1, vy: 0, anim: 0, waves: [], walled: false, hintT: 0, tip: 0, dark: 0, atk: 0, next: 'spawn', jdir: 0, deadT: 0 });
}
function bossMinion(b) {
  let n = 0;
  for (const e of lv.ents) if (e.minion && e.alive && e.type === 'tv') n++;
  if (n >= (b.hp === 3 ? 2 : 3)) return;
  const p = player, d = (p.x + p.w / 2 < b.x + b.w / 2) ? -1 : 1;
  const x = d > 0 ? b.x + b.w : b.x - 14;
  lv.ents.push({ type: 'tv', x, y: b.y + b.h - 30, w: 14, h: 16, vx: d * 0.7, vy: -3, alive: true, active: true, anim: 0, pause: 0, next: 240, minion: true });
  particles.push({ kind: 'poof', x: x + 7, y: b.y + b.h - 22, r: 2, life: 14 });
  sfx('bump');
}
function bossBat(b, col) {
  const x = col * T - 1, y = 4.5 * T;
  lv.ents.push({ type: 'bat', x, y, bx: x, by: y, w: 18, h: 12, alive: true, active: true, t: 0, vy: 0, dir: 1, minion: true });
  particles.push({ kind: 'poof', x: x + 9, y: y + 6, r: 2, life: 14 });
  sfx('whoosh');
}
function bossHit(b) {
  const p = player;
  b.hp--; shake = 12; sfx('pound');
  particles.push({ kind: 'txt', t: 'BUNDADA!', x: b.x + b.w / 2, y: b.y - 14, life: 40, c: '#ff9ccc' });
  sparkle(b.x + b.w / 2, b.y + 6, 14);
  p.bund = false; p.y = b.y - p.h; p.vy = -5.6;
  p.vx = (p.x + p.w / 2 < b.x + b.w / 2 ? -1 : 1) * 2; p.inv = Math.max(p.inv, 95);
  b.waves = [];
  if (b.hp <= 0) {
    b.st = 'dying'; b.t = 120; setMusic('hush');
    for (const e of lv.ents) if (e.minion && e.alive) killEnemy(e, true);
  } else { b.st = 'hurt'; b.t = 70; if (b.hp === 1) bossStep = 0.095; }
}
function updateBoss() {
  const b = lv.boss, p = player;
  if (!b) return;
  const gy = 10 * T - b.h;
  if (b.st === 'dead') {
    if (b.deadT > 0) b.deadT--;
    if (b.dark > 0) b.dark = Math.max(0, b.dark - 0.02);
    if (lv.goal && lv.goal.fall > 0) { lv.goal.fall = Math.max(0, lv.goal.fall - 2); if (!lv.goal.fall) { setMusic('lvl'); sfx('cp'); sparkle(lv.goal.x + 8, 10 * T - 50, 14, '#ffd23f'); } }
    return;
  }
  if (b.st === 'sleep') {
    setMusic(p.x > (b.a - 6) * T ? 'hush' : 'lvl');
    if (!p.dying && p.x > b.a * T + 8) {
      b.st = 'intro'; b.t = BOSS_INTRO; b.walled = true;
      for (let y = 0; y < 10; y++) lv.g[y][b.a - 1] = 'S';
      shake = 10; sfx('pound'); p.face = 1;
    }
    return;
  }
  if (b.hintT > 0) b.hintT--;
  if (b.tip > 0) b.tip--;
  if (b.dark < 1) b.dark = Math.min(1, b.dark + 0.02);
  // gravidade
  if (b.y < gy || b.vy < 0) {
    b.vy += 0.3; b.y += b.vy;
    if (b.st === 'air') b.x = clamp(b.x + b.jdir * 1.3, b.minX, b.maxX);
    if (b.y >= gy) {
      b.y = gy; b.vy = 0;
      if (b.st === 'air') {
        b.st = 'walk'; b.t = 110; shake = 12; sfx('pound');
        const cx = b.x + b.w / 2;
        b.waves.push({ x: cx - 14, dir: -1 }, { x: cx + 14, dir: 1 });
        for (let i = 0; i < 2; i++) particles.push({ kind: 'poof', x: cx + (i ? 20 : -20), y: 10 * T - 3, r: 2, life: 14 });
      }
    }
  }
  b.t--;
  switch (b.st) {
    case 'intro': {
      const el = BOSS_INTRO - b.t;
      if (el === 50 || el === 100) sfx('alarm');
      if (el === 150) sfx('whoosh');
      if (el === 170) { shake = 26; sfx('roar'); }
      if (el === 236) { bossStep = 0.115; setMusic('boss'); }
      if (b.t <= 0) { b.st = 'walk'; b.t = 120; b.tip = 200; }
      break;
    }
    case 'walk': {
      const sp = 0.55 + (3 - b.hp) * 0.25;
      b.x += b.dir * sp; b.anim += sp * 0.25;
      if (b.x <= b.minX) { b.x = b.minX; b.dir = 1; } else if (b.x >= b.maxX) { b.x = b.maxX; b.dir = -1; }
      if (b.t <= 0) { b.atk++; b.next = (b.hp <= 2 && b.atk % 2 === 0) ? 'jump' : 'spawn'; b.st = 'tele'; b.t = 45; sfx('whoosh'); }
      break;
    }
    case 'tele':
      if (b.t <= 0) {
        if (b.next === 'jump') { b.st = 'air'; b.vy = -6.4; b.jdir = Math.sign(p.x + p.w / 2 - (b.x + b.w / 2)); sfx('jump'); }
        else { bossMinion(b); b.st = 'walk'; b.t = 150 - (3 - b.hp) * 30; }
      }
      break;
    case 'hurt':
      if (b.t <= 0) {
        b.st = 'walk'; b.t = 70;
        if (b.hp === 2) bossBat(b, b.a + 3); else if (b.hp === 1) bossBat(b, lv.w - 4);
      }
      break;

      if (b.t % 8 === 0) { sparkle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 8); sfx('stomp'); shake = 4; }

        b.st = 'dead'; b.deadT = 120; stats.kills++;

        b.walled = false;
        particles.push({ kind: 'poof', x: b.x + b.w / 2, y: b.y + b.h / 2, r: 4, life: 14 });
        lv.goal = { x: (b.a + 11) * T, y: 10 * T - 60, w: 16, h: 60, fall: 150 };
        sfx('clear');
      }
      break;
  }
  // ondas de estática
  for (const w of b.waves) {
    w.x += w.dir * 2.4;
    if (!p.dying && p.inv <= 0 && p.x < w.x + 5 && p.x + p.w > w.x - 5 && p.y + p.h > 10 * T - 9) hurt(w.dir);
  }
  b.waves = b.waves.filter(w => w.x > b.a * T && w.x < lv.w * T);
  // contato com a jogadora
  if (p.dying || b.st === 'dying' || b.st === 'hurt' || b.st === 'intro') return;
  if (p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y) {
    if (p.bund && p.vy > 0 && p.prevBottom <= b.y + 12) bossHit(b);
    else if (p.vy > 0 && p.prevBottom <= b.y + 7) {
      p.vy = keys.jump ? -6.4 : -4.4; p.y = b.y - p.h; sfx('bump');
      if (b.hintT <= 0) { b.hintT = 90; particles.push({ kind: 'txt', t: 'USE A BUNDADA!', x: b.x + b.w / 2, y: b.y - 14, life: 50, c: '#ffd23f' }); }
    } else if (p.inv <= 0) hurt(Math.sign(p.x + p.w / 2 - (b.x + b.w / 2)) || 1);
  }
}
function drawBoss(ox) {

  if (cx > -60 && cx < W + 60) {

    if (b.st === 'dead') {

/* ---------- jogadora ---------- */
const G = 0.33, JUMP = -6.1, MAXV = 2.0, MAXFALL = 6.5, KNOCK = 24;
let shake = 0;
function hurt(dir) {
  if (hearts <= 0) return;
  hearts--;
  player.bund = false;
  if (hearts <= 0) { die(false); return; }
  sfx('hurt');
  player.inv = 100; player.knock = KNOCK; player.vx = dir * 2.0; player.vy = -3.2; player.rec = 0;
}
function die(pit) {
  const p = player;
  if (p.dying) return;
  sfx('die');
  p.bund = false;
  p.dying = pit ? 45 : 70; p.vx = 0; p.vy = pit ? 0 : -5.5; p.pit = pit;
}
function respawn() {
  const p = player;
  p.x = lv.spawn.x; p.y = lv.spawn.y; p.vx = 0; p.vy = 0; p.dying = 0; p.inv = 100; p.knock = 0; p.bund = false; p.land = 0; p.rec = 0;
  cam.x = clamp(p.x - W * 0.42, 0, lv.w * T - W);
  resetBoss(lv);
}
function groundPound() {
  const p = player;
  shake = 10; sfx('pound');
  for (let i = 0; i < 2; i++) particles.push({ kind: 'poof', x: p.x + p.w / 2 + (i ? 8 : -8), y: p.y + p.h - 2, r: 2, life: 14 });
  sparkle(p.x + p.w / 2, p.y + p.h, 10, '#ffffff');
  const fy = p.y + p.h;
  for (const e of lv.ents) {
    if (!e.alive || !e.active || e.type !== 'tv') continue;
    if (Math.abs(e.x + e.w / 2 - (p.x + p.w / 2)) < 44 && Math.abs(e.y + e.h - fy) < 6) killEnemy(e, true);
  }
  const ty = Math.floor((fy + 2) / T), tx = Math.floor((p.x + p.w / 2) / T);
  if (tileAt(tx, ty) === '?') activateBlock(tx, ty, true);
  else if (tileAt(tx, ty) === 'B') bumps[tx + ',' + ty] = 10;
}
function updatePlayer() {
  const p = player;
  if (p.dying) {
    p.dying--;
    if (!p.pit) { p.vy += 0.3; p.y += p.vy; }
    if (p.dying <= 0) { if (hearts <= 0) gameOver(); else respawn(); }
    return;
  }
  const lock = !!(lv.boss && lv.boss.st === 'intro');
  if (lock) { input.down = false; input.jumpPressed = false; }
  let dir = lock ? 0 : (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (p.knock > 0) { p.knock--; dir = 0; if (p.knock === 0) p.rec = 20; }
  else if (p.bund) { p.vx *= 0.7; }
  else {
    const acc = p.onGround ? 0.26 : 0.18;
    if (dir) { p.vx += dir * acc; p.face = dir; if (p.onGround && Math.sign(p.vx) !== dir) p.vx += dir * 0.2; }
    else { p.vx *= p.onGround ? 0.72 : 0.94; if (Math.abs(p.vx) < 0.06) p.vx = 0; }
    p.vx = clamp(p.vx, -MAXV, MAXV);
  }
  // bundada
  if (input.down && !p.onGround && !p.bund && p.knock <= 0) {
    p.bund = true; p.bundT = 0; p.vy = -2; p.jbuf = 0; sfx('whoosh');
  }
  if (input.jumpPressed) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (!p.bund && p.jbuf > 0 && p.coyote > 0) { p.vy = JUMP; p.jbuf = 0; p.coyote = 0; p.onGround = false; p.airT = 0; p.land = 0; sfx('jump'); }
  if (p.bund) {
    p.bundT++;
    if (p.bundT < 12) p.vy = Math.min(p.vy + 0.25, 0.4);
    else p.vy = 8;
  } else {
    p.vy += G;
    if (!keys.jump && p.vy < 0) p.vy += G * 1.3;
    if (p.vy > MAXFALL) p.vy = MAXFALL;
  }
  const wasGround = p.onGround, impact = p.vy;
  p.prevBottom = p.y + p.h;
  moveX(p);
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  moveY(p, true);
  if (p.onGround && !wasGround) {
    if (p.bund) { p.bund = false; p.land = 12; groundPound(); }
    else if (impact > 3 && Math.abs(p.vx) < 0.6) p.land = 9;
  }
  if (!p.onGround) p.airT = (p.airT || 0) + 1;
  if (p.inv > 0) p.inv--;
  if (p.land > 0) p.land--;
  if (p.rec > 0) p.rec--;
  p.anim += Math.abs(p.vx) * 0.17;

  // notas
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w) / T), y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (ty >= 0 && ty < ROWS && tx >= 0 && tx < lv.w && lv.g[ty][tx] === 'o') {
      lv.g[ty][tx] = ' '; notesLv++; stats.notes++; sfx('coin'); sparkle(tx * T + 8, ty * T + 8, 5, '#ffd23f');
    }
  }
  // checkpoints
  for (const c of lv.cps) {
    if (!c.on && p.x > c.x) {
      c.on = true; lv.spawn = { x: c.x + 3, y: 10 * T - PH }; sfx('cp'); sparkle(c.x + 8, 10 * T - 30, 12);
      particles.push({ kind: 'txt', t: 'SALVO!', x: c.x + 8, y: 10 * T - 52, life: 50, c: '#ff9ccc' });
    }
  }
  // queda
  if (p.y > H + 8) { hearts = Math.max(0, hearts - 1); die(true); }
  // objetivo
  const gl = lv.goal;
  if (gl && !gl.fall && p.x + p.w > gl.x + 2 && p.x < gl.x + gl.w && p.y + p.h > gl.y) levelClear();
}

function levelClear() {
  setState('clear');
  sfx('clear');
  player.vx = 0;
  confetti(80, cam.x, W);
  if (lvIdx + 1 >= NLV) { save.done = true; writeSave(save); }
}

function drawBG(th, bg, camx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (th.stars) {
    for (const s of bg.stars) {
      const x = ((s.x - camx * 0.04) % 420 + 420) % 420;
      if (x > W) continue;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 0.05 + s.p);
      rect(x, s.y, s.s, s.s, '#ffffff');
    }
    ctx.globalAlpha = 1;
  }
  if (th.sun) {
    const sx = W * 0.72 - camx * 0.02, sy = 46;
    ctx.fillStyle = th.sun; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(sx, sy, 20, 0, 7); ctx.fill();
  }
  if (th.spot) {
    const cols = ['#ff4fa3', '#22e4ff', '#ffd23f', '#9b5cff'];
    ctx.globalAlpha = 0.11;
    for (let i = 0; i < 4; i++) {
      const ox = W * (i + 0.5) / 4, a = Math.sin(t * 0.012 + i * 1.7) * 0.55;
      const len = 260, half = 0.16;
      ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(ox, -6);
      ctx.lineTo(ox + Math.sin(a - half) * len, Math.cos(a - half) * len);
      ctx.lineTo(ox + Math.sin(a + half) * len, Math.cos(a + half) * len); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const base = 10 * T;
  for (const b of bg.far) { const x = b.x - camx * 0.2; if (x > W || x + b.w < 0) continue; rect(x, base - b.h, b.w, b.h, th.far); }
  for (const b of bg.near) {
    const x = b.x - camx * 0.45; if (x > W || x + b.w < 0) continue;
    rect(x, base - b.h, b.w, b.h, th.near);
    if (th.win) {
      for (let wy = base - b.h + 6; wy < base - 8; wy += 9) for (let wx = 4; wx < b.w - 5; wx += 7) {
        const hsh = (b.s * 31 + wx * 7 + wy * 13) % 10;
        if (hsh < 4) rect(x + wx, wy, 3, 4, th.win);
      }
    }
  }
  if (th.crowd) {
    const off = camx * 0.6;
    for (let i = -1; i < W / 9 + 2; i++) {
      const wi = i + Math.floor(off / 9), x = wi * 9 - off;
      const bob = Math.sin(t * 0.15 + wi * 0.9) > 0 ? 1 : 0;
      const hgt = 8 + ((wi * 7919) % 5);
      rect(x, base - hgt - bob, 7, hgt + bob, '#0b0414');
      rect(x + 1, base - hgt - 6 - bob, 5, 6, '#0b0414');
      if (((wi * 31) % 3) === 0) {
        const c = ['#ff4fa3', '#22e4ff', '#ffd23f'][(wi >>> 0) % 3];
        const sw = Math.sin(t * 0.12 + wi) > 0 ? 2 : -1;
        rect(x + 3 + sw, base - hgt - 16 - bob, 2, 6, c);
      }
    }
  }
}

      else { rect(px + 9, py + 5, 2, 2, th.groundDk); rect(px + 4, py + 12, 2, 2, th.groundDk); }

      for (let j = 0; j < 8; j++) for (let i = 0; i < 6; i++) if (QMARK[j][i] === 'x') { rect(px + 5 + i + 1, py + 4 + j + 1, 1, 1, '#a35e00'); rect(px + 5 + i, py + 4 + j, 1, 1, '#fffbe8'); }

function drawLevel(ox) {
  const t0 = Math.max(0, Math.floor(ox / T)), t1 = Math.min(lv.w - 1, Math.floor((ox + W) / T) + 1);
  for (const k in bumps) { bumps[k]--; if (bumps[k] <= 0) delete bumps[k]; }
  for (let ty = 0; ty < ROWS; ty++) for (let tx = t0; tx <= t1; tx++) {
    const ch = lv.g[ty][tx];
    if (ch === ' ') continue;
    const bk = bumps[tx + ',' + ty];
    const off = bk ? -Math.round(Math.sin((10 - bk) / 10 * Math.PI) * 5) : 0;
    drawTile(ch, tx * T - ox, ty * T + off, tx, ty);
  }
  // checkpoints (lightsticks)
  for (const c of lv.cps) {
    const x = c.x - ox; if (x < -20 || x > W + 20) continue;
    const gy = 10 * T;
    rect(x + 5, gy - 3, 6, 3, '#555'); rect(x + 7, gy - 26, 2, 24, '#dddddd');
    if (c.on) {
      const a = 0.25 + 0.15 * Math.sin(frame * 0.15);
      ctx.globalAlpha = a; rect(x - 2, gy - 42, 20, 20, '#ff4fa3'); ctx.globalAlpha = 1;
      rect(x + 4, gy - 38, 8, 12, '#ff4fa3'); rect(x + 5, gy - 37, 3, 9, '#ffc2e0');
    } else { rect(x + 4, gy - 38, 8, 12, '#5a4a70'); rect(x + 5, gy - 37, 2, 9, '#7a6a90'); }
  }
  // microfone dourado
  const gl = lv.goal;
  if (gl) {
    const x = gl.x - ox, gy = 10 * T - (gl.fall || 0);
    if (x > -40 && x < W + 40) {
      const a = 0.18 + 0.1 * Math.sin(frame * 0.1);
      ctx.globalAlpha = a; ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x + 8, gy - 52, 18, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      rect(x + 1, gy - 4, 14, 4, '#b8860b'); rect(x + 2, gy - 5, 12, 1, '#ffe17a');
      rect(x + 7, gy - 44, 2, 40, '#d4af37'); rect(x + 7, gy - 44, 1, 40, '#fff0a0');
      rect(x + 5, gy - 46, 6, 3, '#8a6510');
      rect(x + 4, gy - 60, 8, 14, '#ffd23f'); rect(x + 3, gy - 58, 10, 10, '#ffd23f');
      for (let j = 0; j < 4; j++) for (let i = 0; i < 3; i++) rect(x + 5 + i * 2 + (j & 1), gy - 58 + j * 2 + 1, 1, 1, '#b8860b');
      rect(x + 4, gy - 59, 2, 3, '#fffbe0');
      for (let i = 0; i < 3; i++) {
        const an = frame * 0.05 + i * 2.1;
        rect(x + 8 + Math.cos(an) * 16, gy - 52 + Math.sin(an) * 10, 2, 2, '#fff6c0');
      }
    }

}
function drawEntities(ox) {
  for (const e of lv.ents) {
    const cx = e.x - ox + e.w / 2;
    if (cx < -30 || cx > W + 30 || !e.active && e.x > cam.x + W + 30) continue;
    if (e.type === 'tv') {
      const by = e.y + e.h;
      if (!e.alive) {
        if (e.deadT <= 0) continue;
        const el = e.deadMax - e.deadT;
        if (e.falling) { drawFrame('tvHurt', 1, cx, by - 8, e.vx > 0 ? 1 : -1, 1, true); continue; }
        if (e.deadT < 16) ctx.globalAlpha = e.deadT / 16;
        if (el < 15) drawFrame('tvHurt', Math.floor(el / 5), cx, by, 1);
        else drawFrame('tvDead', 0, cx, by, 1);
        ctx.globalAlpha = 1;
        continue;
      }
      if (e.pause > 0) drawFrame('tvIdle', Math.floor(frame / 9), cx, by, e.vx > 0 ? 1 : -1);
      else drawFrame(e.vx > 0 ? 'tvWalkR' : 'tvWalkL', Math.floor(e.anim), cx, by, 0);
    } else {
      const cy = e.y + e.h / 2 - 2;
      if (!e.alive) {
        if (e.deadT <= 0 || e.y > H + 20) continue;
        const el = e.deadMax - e.deadT;
        if (el < 15) drawFrame('batHurt', Math.floor(el / 5), cx, cy, e.dir);
        else drawFrame('batDead', 0, cx, cy, e.dir);
        continue;
      }
      if (e.hover) drawFrame('batHover', Math.floor(frame / 6), cx, cy, e.dir);
      else drawFrame(e.dir > 0 ? 'batR' : 'batL', Math.floor(frame / 4 + e.bx), cx, cy, 0);
    }
  }
}

function playerAnim(p) {
  if (p.dying) return ['hurtJump', Math.floor(frame / 6) % 4, p.face];
  if (p.knock > 0) return [p.onGround ? 'hurtWalk' : 'hurtJump', Math.min(3, Math.floor((KNOCK - p.knock) / (KNOCK / 4))), p.face];
  if (p.bund) return ['bundada', Math.min(5, Math.floor(p.bundT / 2.5)), p.face];
  if (!p.onGround) {
    if (p.vy < -2.2) return ['jumpUp', 2 + Math.min(2, Math.floor(p.airT / 5)), p.face];
    if (p.vy < 1.2) return ['jumpApex', Math.floor(frame / 6) % 3, p.face];
    if (p.vy < 4) return ['jumpDown', Math.floor(frame / 6) % 3, p.face];
    return ['fall', Math.floor(frame / 6) % 3, p.face];
  }
  if (p.land > 0) return ['fall', 3 + Math.min(3, Math.floor((12 - p.land) / 3)), p.face];
  if (Math.abs(p.vx) > 0.25) return [p.face > 0 ? 'walkR' : 'walkL', Math.floor(p.anim), 0];
  if (p.rec > 0) return ['recover', Math.min(3, Math.floor((20 - p.rec) / 5)), p.face];
  const k = Math.floor(frame / 12) % 8;
  return ['idle', [0, 1, 2, 3, 4, 3, 2, 1][k], p.face];
}
function drawPlayer(ox) {
  const p = player;
  if (p.dying && p.pit) return;
  if (p.inv > 0 && !p.dying && p.knock <= 0 && (frame >> 2) & 1) ctx.globalAlpha = 0.35;
  const [name, idx, face] = playerAnim(p);
  drawFrame(name, idx, p.x + p.w / 2 - ox, p.y + p.h + 1, face);
  ctx.globalAlpha = 1;
}

  rect(x - 2, y - 2, pw + 4, ph + 4, '#ff4fa3');

  else rect(x, y, pw, ph, '#ffc6d6');
  // brilho passando
  const sx = ((frame * 1.2) % 260) - 60;
  if (sx > -10 && sx < pw) { ctx.globalAlpha = 0.22; for (let i = 0; i < 6; i++) rect(x + Math.max(0, Math.min(pw - 1, sx + i)), y, 1, ph, '#ffffff'); ctx.globalAlpha = 1; }
  // estrelinhas em volta
  for (let i = 0; i < 6; i++) {
    const a = frame * 0.02 + i * 1.05, rr = 1 + ((frame >> 3) + i) % 2;
    const px = x + pw / 2 + Math.cos(a) * (pw / 2 + 12), py = y + ph / 2 + Math.sin(a) * (ph / 2 + 10);

}
function drawTitle() {
  if (!titleBG) { const tl = { w: 400, seed: 99 }; genBG(tl); titleBG = tl.bg; }
  drawBG(THEMES[3], titleBG, frame * 0.6, frame);
  rect(0, 10 * T, W, H - 10 * T, '#1e1a26'); rect(0, 10 * T, W, 4, '#ffcc33'); rect(0, 10 * T, W, 1, '#fff2b0');
  const cx0 = W >= 320 ? 18 : 10, cy0 = 22;
  drawPortraitCard(cx0, cy0);
  const rx = cx0 + 96, cx = rx + (W - rx) / 2, rw = W - rx;
  const bob = Math.round(Math.sin(frame * 0.06) * 2);
  text(CONFIG.nome, cx, 22 + bob, { size: rw >= 170 ? 24 : 16, color: '#ff4fa3', shadowColor: '#3a0a40' });
  text('RUMO AO PALCO', cx, 54, { color: '#ffd23f' });
  menuRects = [];
  const y0 = 84;
  if (!titlePressed) {
    if ((frame >> 5) & 1) text(isTouch ? 'TOQUE PARA' : 'APERTE ENTER', cx, y0, { color: '#ffffff' });
    if ((frame >> 5) & 1) text(isTouch ? 'COMEÇAR' : 'PARA COMEÇAR', cx, y0 + 12, { color: '#ffffff' });
  } else {
    menuItems.forEach((m, i) => {
      const y = y0 + i * 16, w = Math.min(rw - 4, m.t.length * 8 + 20), x = cx - w / 2;
      menuRects.push({ x, y: y - 3, w, h: 14, a: m.a, i });
      if (i === menuIdx) { rect(x, y - 3, w, 14, 'rgba(255,79,163,.35)'); text('>', x + 6, y, { color: '#ffd23f' }); }
      text(m.t, cx + 4, y, { color: i === menuIdx ? '#ffffff' : '#c8b4ff' });
    });
  }
  // desfile no palco
  const span = W + 120, sx = ((frame * 0.9) % span) - 40;
  drawFrame('tvWalkR', Math.floor(frame * 0.2), sx - 46, 10 * T + 1, 0);
  drawFrame('walkR', Math.floor(frame * 0.3), sx, 10 * T + 1, 0);
  drawFrame('batR', Math.floor(frame / 4), ((frame * 0.7 + 200) % span) - 40, 150 + Math.sin(frame * 0.07) * 5, 0);
  const hint = isTouch ? 'Botões: andar, pular, bundada' : 'SETAS andam - ESPAÇO pula';
  text(hint, W / 2, H - 14, { color: '#fff2b0' });
}

function storyLines() {
  return [
    [CONFIG.nome + ', VOCÊ FOI', '#ff9ccc'], ['ESCOLHIDA PARA O GRANDE SHOW!', '#ff9ccc'], ['', ''],
    ['Mas as TVs da fofoca estão por', '#fff'], ['toda parte. Pule em cima delas!', '#fff'], ['', ''],
    ['Em cada fase há um', '#fff'], ['MICROFONE DOURADO.', '#ffd23f'], ['', ''],
    ['Pegue os ' + NLV + ' e descubra o código', '#fff'], ['de um presente DE VERDADE!', '#22e4ff']
  ];
}
function drawStory() {
  rect(0, 0, W, H, '#12062a');
  for (let i = 0; i < 30; i++) { const x = (i * 97 + frame * 0.2) % W, y = (i * 53) % H; ctx.globalAlpha = 0.3 + 0.3 * Math.sin(frame * 0.05 + i); rect(x, y, 1, 1, '#fff'); }
  ctx.globalAlpha = 1;
  const L = storyLines();
  const shown = Math.min(L.length, Math.floor(stateT / 8) + 1);
  for (let i = 0; i < shown; i++) text(L[i][0], W / 2, 12 + i * 12, { color: L[i][1] });
  if (shown >= L.length && (frame >> 4) & 1) text(isTouch ? 'toque para começar' : 'ENTER para começar', W / 2, H - 16, { color: '#ffd23f' });
}
function drawLvlIntro() {
  rect(0, 0, W, H, '#0e0720');
  const th = THEMES[lvIdx % THEMES.length];
  text('FASE ' + (lvIdx + 1) + ' DE ' + NLV, W / 2, 36, { color: '#c8b4ff' });
  const nsz = th.name.length * 24 <= W - 16 ? 24 : 16;
  text(th.name, W / 2, nsz === 24 ? 58 : 62, { size: nsz, color: '#ff4fa3', shadowColor: '#3a0a40' });
  text(th.sub, W / 2, 94, { color: '#ffd23f' });
  const k = Math.floor(frame / 12) % 8;
  drawFrame('idle', [0, 1, 2, 3, 4, 3, 2, 1][k], W / 2, 152, 1, 1.4);
  text(th.tip, W / 2, 158, { color: '#ffffff' });
  text('VIDAS', W / 2 - 18, 18, { color: '#ff9ccc' });
  for (let i = 0; i < 3; i++) { ctx.save(); ctx.translate(W / 2 + 8 + i * 12, 18); ctx.scale(1.3, 1.3); ctx.drawImage(i < hearts ? HEART : HEART0, 0, 0); ctx.restore(); }
  if (lvIdx === 0) text(isTouch ? 'No ar, toque BUNDADA!' : 'No ar, SETA P/ BAIXO = BUNDADA!', W / 2, 172, { color: '#ff9ccc' });
}
function miniMic(cx, y, sc, on) {
  const c = on ? '#ffd23f' : '#4a3a6a', d = on ? '#b8860b' : '#3a2d55';
  ctx.save(); ctx.translate(cx, y); ctx.scale(sc / 1, sc / 1);
  ctx.fillStyle = c; ctx.fillRect(-2, 0, 4, 5); ctx.fillRect(-2.5, 1, 5, 3);
  ctx.fillStyle = d; ctx.fillRect(-1, 1, 1, 1); ctx.fillRect(1, 2, 1, 1); ctx.fillRect(-1, 3, 1, 1);
  ctx.fillStyle = on ? '#d4af37' : '#3a2d55'; ctx.fillRect(-0.5, 5, 1, 3); ctx.fillRect(-2, 8, 4, 1);
  ctx.restore();
}
function pct(a, b) { return b > 0 ? Math.round(100 * a / b) : 100; }
function drawClear() {
  drawGame();
  rect(0, 0, W, H, 'rgba(10,4,24,' + Math.min(0.55, stateT / 40) + ')');
  drawParticles(cam.x);
  if (stateT < 20) return;
  const pw = 236, ph = 160, px = Math.round(W / 2 - pw / 2), py = Math.round(H / 2 - ph / 2);
  panel(px, py, pw, ph);
  text('MICROFONE DOURADO!', W / 2, py + 9, { color: '#ffd23f' });
  text('FASE ' + (lvIdx + 1) + ' DE ' + NLV + ' CONCLUÍDA!', W / 2, py + 23, { color: '#ffffff' });
  const rows = [
    ['TVs derrotadas', pct(stats.kills, stats.killsTot), '#ff4fa3', 'tv'],
    ['Notas musicais', pct(stats.notes, stats.notesTot), '#ffd23f', 'note'],
    ['Caixas abertas', pct(stats.boxes, stats.boxesTot), '#22e4ff', 'box']
  ];
  const prog = clamp((stateT - 28) / 45, 0, 1);
  let all = true;
  rows.forEach((r, i) => {
    const y = py + 40 + i * 22, v = Math.round(r[1] * prog), full = r[1] === 100;
    if (!full) all = false;
    const ix = px + 18;
    if (r[3] === 'tv') drawFrame('tvIdle', Math.floor(frame / 9), ix, y + 13, 1, 0.55);
    else if (r[3] === 'note') ctx.drawImage(NOTE, ix - 4, y + 2);
    else { ctx.save(); ctx.translate(ix - 5, y + 1); ctx.scale(0.62, 0.62); drawTile('?', 0, 0, 0, 0); ctx.restore(); }
    text(r[0], px + 32, y, { align: 'left', color: '#ffffff' });
    text(v + '%', px + pw - 14, y, { align: 'right', color: full && prog >= 1 ? '#ffd23f' : '#ffffff' });
    const bx = px + 32, bw = pw - 46;
    rect(bx, y + 11, bw, 3, '#2b1d45');
    rect(bx, y + 11, Math.round(bw * v / 100), 3, r[2]);
  });
  const gap = 24, sx = W / 2 - (NLV - 1) * gap / 2;
  for (let i = 0; i < NLV; i++) {
    const got = i <= lvIdx, isNew = i === lvIdx;
    const sc = isNew ? 2 + Math.max(0, (40 - stateT) / 40) : 2;
    rect(sx + i * gap - 9, py + 108, 18, 22, got ? '#5a2a7a' : '#24163d');
    miniMic(sx + i * gap, py + 110, sc, got);
  }
  if (all && prog >= 1) text('PERFEITO! 100% em tudo!', W / 2, py + 135, { color: (frame >> 3) & 1 ? '#ffd23f' : '#ff9ccc' });
  else text(lvIdx + 1 >= NLV ? 'Agora o código vai aparecer!' : 'O código aparece no final!', W / 2, py + 135, { color: '#c8b4ff' });
  if (stateT > 80 && (frame >> 4) & 1) text(isTouch ? 'toque para continuar' : 'ENTER para continuar', W / 2, py + 148, { color: '#ffd23f' });
}
function gameOver() {
  particles = []; shake = 0;
  goLevel = lvIdx;
  setState('gameover'); sfx('gameover');
}
let goLevel = 0;
function drawGameOver() {
  rect(0, 0, W, H, '#0b0910');
  if (gameoverReady) {
    ctx.globalAlpha = Math.min(1, stateT / 40);
    if (W >= 330) ctx.drawImage(GAMEOVER, Math.round(W / 2 - 168), 0, 336, 192);
    else { const sc = W / 336; ctx.imageSmoothingEnabled = true; ctx.drawImage(GAMEOVER, 0, Math.round((H - 34 - 192 * sc) / 2), W, 192 * sc); ctx.imageSmoothingEnabled = false; }
    ctx.globalAlpha = 1;
  }
  if (stateT < 50) return;
  ctx.globalAlpha = Math.min(1, (stateT - 50) / 20);
  rect(0, H - 34, W, 34, 'rgba(8,4,16,.78)');
  text('Você chegou até a FASE ' + (goLevel + 1) + '.', W / 2, H - 30, { color: '#ffffff' });
  if (stateT > 90 && (frame >> 4) & 1) text(isTouch ? 'toque para tentar de novo' : 'ENTER para tentar de novo', W / 2, H - 16, { color: '#ffd23f' });
  ctx.globalAlpha = 1;
}
const F_NAME = 110, F_CODE = 220, F_GAP = 55, F_MSG = F_CODE + 50 + (NLV - 1) * F_GAP + 40, F_END = F_MSG + 120;
const fLock = i => F_CODE + 50 + i * F_GAP;
function finalBox(i) { const bw = 30, gap = 6, tw = NLV * bw + (NLV - 1) * gap; return { x: W / 2 - tw / 2 + i * (bw + gap), bw }; }
function finalTick() {
  const t = stateT;
  if (t === F_NAME) { sfx('clear'); confetti(70, 0, W); }
  if (t === F_CODE) sfx('select');
  if (t > F_CODE + 20 && t < fLock(NLV - 1) && t % 4 === 0) sfx('tick');
  for (let i = 0; i < NLV; i++) if (t === fLock(i)) { const b = finalBox(i); sfx('coin'); sparkle(b.x + b.bw / 2, 74, 14); }
  if (t === F_MSG) { sfx('final'); confetti(60, 0, W); }
  if (t > F_MSG && t % 50 === 0) sparkle(20 + Math.random() * (W - 40), 20 + Math.random() * 70, 16);
}
function drawFinal() {
  if (!titleBG) { const tl = { w: 400, seed: 99 }; genBG(tl); titleBG = tl.bg; }
  const t = stateT, gy = 10 * T;
  drawBG(THEMES[3], titleBG, frame * 0.3, frame);
  rect(0, gy, W, H - gy, '#1e1a26'); rect(0, gy, W, 4, '#ffcc33');
  rect(0, 0, W, H, 'rgba(10,4,24,.45)');
  if (frame % 6 === 0 && t >= F_NAME) confetti(2, 0, W);
  if (t < F_CODE) {
    // entrada no palco
    const sx = Math.min(W / 2, -20 + t * (W / 2 + 20) / (F_NAME - 10));
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#fff2b0'; ctx.beginPath();
    ctx.moveTo(sx - 6, -4); ctx.lineTo(sx + 6, -4); ctx.lineTo(sx + 30, gy); ctx.lineTo(sx - 30, gy); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    drawParticles(0);
    if (sx < W / 2) drawFrame('walkR', Math.floor(t * 0.3), sx, gy + 1, 0, 1.3);
    else drawFrame('jumpApex', Math.floor(frame / 7), sx, gy + 1 - Math.abs(Math.sin((t - F_NAME) * 0.09)) * 16, 1, 1.3);
    if (t < F_NAME) text('E AGORA, COM VOCÊS...', W / 2, 44, { color: '#ffffff' });
    else {
      const big = CONFIG.nome.length * 24 + 24 <= W - 8 ? 24 : 16;
      text(CONFIG.nome + '!', W / 2, 30 + Math.round(Math.sin(frame * 0.1) * 2), { size: big, color: '#ff4fa3', shadowColor: '#3a0a40' });
      text('A ESTRELA DO GRANDE SHOW', W / 2, 64, { color: '#ffd23f' });
    }
    return;
  }
  drawParticles(0);
  text('PARABÉNS, ' + CONFIG.nome + '!', W / 2, 10, { color: '#ff4fa3', shadowColor: '#3a0a40' });
  text('Você pegou os ' + NLV + ' microfones!', W / 2, 24, { color: '#ffffff' });
  text('CÓDIGO DO PRESENTE', W / 2, 42, { color: '#ffd23f' });
  for (let i = 0; i < NLV; i++) {
    const b = finalBox(i), x = b.x, bw = b.bw, lk = fLock(i), on = t >= lk;
    const jump = on ? Math.round(Math.max(0, Math.sin(frame * 0.08 - i * 0.6)) * 4) : 0;
    rect(x, 56 - jump, bw, 36, on ? (t - lk < 8 ? '#ffffff' : '#ffd23f') : '#7a5a9a'); rect(x + 2, 58 - jump, bw - 4, 32, '#2b0f4a');
    if (on) text(String(CODE[i]), x + bw / 2 + 1, 62 - jump, { size: 24, color: '#ffffff', shadowColor: '#ff4fa3' });
    else if (t < F_CODE + 20 + i * 6) miniMic(x + bw / 2, 62, 3, true);
    else text(String((Math.floor(frame / 3) * 7 + i * 3) % 10), x + bw / 2 + 1, 62, { size: 24, color: '#8f7ab8', shadowColor: '#1a0b33' });
  }
  if (t >= F_MSG) {
    ctx.globalAlpha = Math.min(1, (t - F_MSG) / 30);
    text(CONFIG.mensagem[0], W / 2, 102, { color: '#ffffff' });
    text(CONFIG.mensagem[1], W / 2, 114, { color: '#ffffff' });
    text(CONFIG.assinatura, W / 2, 132, { color: '#ff9ccc' });
    ctx.globalAlpha = 1;
  }
  const hop = Math.abs(Math.sin(frame * 0.07)) * 14;
  drawFrame('jumpApex', Math.floor(frame / 7), 30, gy + 1 - hop, 1, 1.3);
  drawFrame('jumpApex', Math.floor(frame / 7) + 1, W - 30, gy + 1 - Math.abs(Math.sin(frame * 0.07 + 1.5)) * 14, -1, 1.3);
  if (t > F_END && (frame >> 5) & 1) text(isTouch ? 'toque para voltar' : 'ENTER para voltar', W / 2, H - 14, { color: '#c8b4ff' });
}

function drawGame() {
  let ox = Math.round(cam.x);
  if (shake > 0) { shake--; ox += (shake & 2) ? 2 : -2; }
  drawBG(theme, lv.bg, ox, frame);
  drawBossTint();
  drawLevel(ox);
  drawEntities(ox);
  drawBoss(ox);
  drawPlayer(ox);
  if (state === 'play') drawParticles(ox);
  drawHUD();
  drawBossHUD();
  drawBossCine();
}

/* ---------- loop ---------- */
function update() {
  frame++; stateT++;
  if (input.confirm && state !== 'play') initAudio();
  switch (state) {
    case 'title':
      if (!titlePressed) { if (input.confirm) { titlePressed = true; stateT = 0; sfx('select'); } break; }
      if (input.up) { menuIdx = (menuIdx + menuItems.length - 1) % menuItems.length; sfx('select'); }
      if (input.down) { menuIdx = (menuIdx + 1) % menuItems.length; sfx('select'); }
      if (input.confirm && stateT > 10) {
        if (tapPoint) {
          const hit = menuRects.find(r => tapPoint.x >= r.x - 6 && tapPoint.x <= r.x + r.w + 6 && tapPoint.y >= r.y - 3 && tapPoint.y <= r.y + r.h + 3);
          if (hit) menuAction(hit.a);
          else if (menuItems.length === 1) menuAction(menuItems[0].a);
        } else menuAction(menuItems[menuIdx].a);
      }
      break;
    case 'story':
      if (input.confirm && stateT > 20) {
        if (stateT < storyLines().length * 8) stateT = storyLines().length * 8;
        else { loadLevel(0); setState('lvlintro'); sfx('select'); }
      }
      break;
    case 'lvlintro':
      if ((input.confirm && stateT > 30) || stateT > 200) setState('play');
      break;
    case 'play':
      updatePlayer();
      updateEnemies();
      updateBoss();
      updateParticles();
      if (!player.dying) {
        const hi = lv.w * T - W, bs = lv.boss;
        const lo = bs && bs.walled ? Math.min((bs.a - 1) * T, hi) : 0;
        const target = clamp(bs && bs.st === 'intro' ? bs.x + bs.w / 2 - W * 0.62 : player.x - W * 0.42, lo, hi);
        cam.x += (target - cam.x) * 0.15;
        cam.x = clamp(cam.x, 0, hi);
      }
      break;
    case 'clear':
      updateParticles();
      if (input.confirm && stateT > 80) {
        if (lvIdx + 1 >= NLV) { particles = []; setState('final'); sfx('final'); }
        else { loadLevel(lvIdx + 1); setState('lvlintro'); }
      }
      break;
    case 'gameover':
      if (input.confirm && stateT > 90) { buildMenu(); setState('title'); }
      break;
    case 'final':
      updateParticles(); finalTick();
      if (input.confirm && stateT > F_END) { buildMenu(); setState('title'); }
      break;
  }
  input.jumpPressed = false; input.confirm = false; input.up = false; input.down = false; tapPoint = null;
}
function draw() {
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  switch (state) {
    case 'title': drawTitle(); break;
    case 'story': drawStory(); break;
    case 'lvlintro': drawLvlIntro(); break;
    case 'play': drawGame(); break;
    case 'clear': drawClear(); break;
    case 'final': drawFinal(); break;
    case 'gameover': drawGameOver(); break;
  }
}
let last = 0, acc = 0;
function loop(ts) {
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
buildMenu();
const startLoop = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  const atlasP = ATLAS.decode ? ATLAS.decode().catch(() => { }) : Promise.resolve();
  Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'), atlasP]), new Promise(r => setTimeout(r, 2500))]).then(startLoop, startLoop);
} else startLoop();
cv.focus();

/* ganchos para teste */
window.__game = { get state() { return state; }, get stateT() { return stateT; }, set stateT(v) { stateT = v; }, get hearts() { return hearts; }, set hearts(v) { hearts = v; }, get stats() { return stats; }, get cam() { return cam; }, get music() { return musicMode; }, get player() { return player; }, loadLevel, setState, get lv() { return lv; }, keys: kb, input };
</script>
